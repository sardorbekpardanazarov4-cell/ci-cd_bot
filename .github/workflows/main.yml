name: Bot Deploy Test

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH orqali ulanish
        uses: appleboy/ssh-action@v1.0.3  # Versiyani yangiladim
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            echo "Men serverga kirdim!"
            cd ~/my-bot
            git pull origin main
            pkill -f bot.py || true
            nohup python3 bot.py > bot.log 2>&1 &
